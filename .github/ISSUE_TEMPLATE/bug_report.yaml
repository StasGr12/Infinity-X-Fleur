name: Bug Report
description: Submit a bug report
body:
  - type: textarea
    id: describe-the-bug
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: to-reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the BUG
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A description of what you expected to happen.
    validations:
      required: true

  - type: input
    id: infinity-x-version
    attributes:
      label: Infinity X version
      placeholder: "e.g. Infinity X 3.10"
    validations:
      required: true

  - type: input
    id: phone-codename
    attributes:
      label: Phone Codename
      placeholder: "FLEUR / MIEL"
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
    validations:
      required: 
      false
      
  - type: file-upload
    id: screenshots
    attributes:
      label: Screenshots
      description: Add screenshots to help explain your problem.
    validations:
      required: false
      
